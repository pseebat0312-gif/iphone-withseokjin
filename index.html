<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>金硕珍的手机</title>
    <link rel="stylesheet" href="style.css?v=999">
</head>
<body>
    <div class="netlify-blocker"></div>

    <div id="phone">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span id="status-time">15:54</span>
            <div class="status-icons"><span>📶</span><span>🔋</span></div>
        </div>

        <!-- 锁屏 -->
        <section id="lock-screen" class="screen active">
            <div id="lock-wallpaper-layer" style="position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') center/cover; z-index: -1;"></div>
            <div class="lock-time-area">
                <div class="lock-date" id="lock-date">5月21日 星期六</div>
                <div class="lock-time" id="lock-time">23:48</div>
            </div>
            <div class="swipe-up-area" id="swipe-up-trigger">
                <span>向上轻扫以解锁</span>
                <div class="home-indicator"></div>
            </div>
        </section>

        <!-- 密码 -->
        <section id="passcode-screen" class="screen">
            <div class="passcode-area">
                <div class="dots" id="dots"></div>
                <div class="keypad" id="keypad"></div>
            </div>
            <div class="swipe-down-area" id="swipe-down-trigger">
                <div class="home-indicator"></div>
            </div>
        </section>

        <!-- 主屏幕 -->
        <section id="home-screen" class="screen">
            <div id="wallpaper-layer" style="position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') center/cover; z-index: -1;"></div>
            <div id="home-notifications-wrapper" class="home-notifications-wrapper"></div>
            <div class="home-pages-container" id="home-pages">
                <div class="home-page" id="page-1"></div>
                <div class="home-page" id="page-2"></div>
            </div>
            <div class="page-dots">
                <span class="page-dot active"></span>
                <span class="page-dot"></span>
            </div>
            <div class="dock" id="dock"></div>
            <div class="home-indicator-btn" id="home-indicator"></div>
        </section>

        <!-- 全局弹窗 -->
        <div id="banner-notification" class="banner-notification">
            <div class="notif-icon" id="banner-icon">💬</div>
            <div class="notif-content">
                <div class="notif-header"><span id="banner-title">KakaoTalk</span><span class="notif-time">现在</span></div>
                <div class="notif-msg" id="banner-msg">消息内容...</div>
            </div>
        </div>

        <!-- ================= App 统一外壳 ================= -->
        <section id="app-view" class="screen">
            <!-- 绝对写死的顶部 Header -->
            <div class="app-header">
                <button class="back-btn" id="app-back-btn">‹ 返回</button>
                <span class="app-title" id="app-title-text">KakaoTalk</span>
                <span style="width: 60px;"></span>
            </div>

            <!-- App 内容区 -->
            <div class="app-body" id="app-body-content"></div>
        </section>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
