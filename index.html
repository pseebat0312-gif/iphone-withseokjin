<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>my iphone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 手机外框 -->
    <div id="phone">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span id="status-time">9:41</span>
            <div class="status-icons">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- 锁屏界面 -->
        <section id="lock-screen" class="screen active">
            <div class="lock-time" id="lock-time">9:41</div>
            <div class="lock-date" id="lock-date">12月4日 星期三</div>
            
            <div class="passcode-area">
                <div class="dots" id="dots"></div>
                <div class="keypad" id="keypad"></div>
            </div>
        </section>

        <!-- 主屏幕 -->
        <section id="home-screen" class="screen">
            <div class="app-grid" id="app-grid"></div>
            <!-- 底部 Dock 栏 -->
            <div class="dock" id="dock"></div>
            <!-- 底部小白条 -->
            <div class="home-indicator" id="home-indicator"></div>
        </section>

        <!-- App 容器（全屏覆盖） -->
        <section id="app-view" class="screen"></section>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
