<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>金硕珍女友的手机</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="phone">
        <div class="status-bar">
            <span id="status-time">15:54</span>
            <div class="status-icons"><span>📶</span><span>🔋</span></div>
        </div>

        <section id="lock-screen" class="screen active">
            <div class="lock-notifications" id="lock-notifications">
                <!-- 这里用JS注入的锁屏通知 -->
            </div>
            <div class="lock-time-area">
                <div class="lock-date" id="lock-date">5月21日 星期六</div>
                <div class="lock-time" id="lock-time">23:48</div>
            </div>
            <div class="swipe-up-area" id="swipe-up-trigger">
                <span>向上轻扫以解锁</span>
                <div class="home-indicator"></div>
            </div>
        </section>

        <section id="passcode-screen" class="screen">
            <div class="passcode-area">
                <div class="dots" id="dots"></div>
                <div class="keypad" id="keypad"></div>
            </div>
            <div class="swipe-down-area" id="swipe-down-trigger">
                <div class="home-indicator"></div>
            </div>
        </section>

        <section id="home-screen" class="screen">
            <div class="home-pages-container" id="home-pages">
                <div class="home-page" id="page-1"></div>
                <div class="home-page" id="page-2"></div>
            </div>
            <div class="page-dots">
                <span class="page-dot active"></span>
                <span class="page-dot"></span>
            </div>
            <div class="dock" id="dock"></div>
            <div class="home-indicator-btn" id="home-indicator"></div>
        </section>

        <div id="banner-notification" class="banner-notification" onclick="openApp('kkt')">
            <div class="notif-icon" id="banner-icon">💬</div>
            <div class="notif-content">
                <div class="notif-header"><span id="banner-title">KakaoTalk</span><span class="notif-time">现在</span></div>
                <div class="notif-msg" id="banner-msg">消息内容...</div>
            </div>
        </div>

        <section id="app-view" class="screen"></section>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
