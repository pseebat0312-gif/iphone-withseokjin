<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#202020;color:#aaa;font:11px -apple-system,sans-serif}#embed{min-height:152px}iframe{border:0;display:block}#error{padding:15px;line-height:1.8}a{color:#1ed760}</style></head><body><div id="embed"></div><div id="error" hidden>Spotify could not connect. <a id="official" target="_blank" rel="noopener noreferrer">Open in Spotify ↗</a></div><script>
const id=new URL(location.href).searchParams.get('track');const valid=/^[A-Za-z0-9]{22}$/.test(id||'');let controller=null;const origin=location.origin;function tell(type,data){parent.postMessage({channel:'withyou-spotify',type,data},origin)}
window.onSpotifyIframeApiReady=api=>{if(!valid)return;api.createController(document.getElementById('embed'),{uri:'spotify:track:'+id,width:'100%',height:152},c=>{controller=c;c.addListener('ready',()=>tell('ready',{}));c.addListener('playback_update',e=>tell('playback',{playingURI:e.data.playingURI||'',position:Number(e.data.position)||0,duration:Number(e.data.duration)||0,isPaused:Boolean(e.data.isPaused),isBuffering:Boolean(e.data.isBuffering)}))})};
window.addEventListener('message',e=>{if(e.origin!==origin||e.source!==parent||e.data?.channel!=='withyou-control'||!controller)return;const {command,value}=e.data;if(command==='load'&&/^spotify:track:[A-Za-z0-9]{22}$/.test(value))controller.loadEntity(value);if(command==='play')controller.play();if(command==='pause')controller.pause();if(command==='toggle')controller.togglePlay();if(command==='seek'&&Number.isFinite(value))controller.seek(Math.max(0,Math.min(86400,value)))});
const script=document.createElement('script');script.src='https://open.spotify.com/embed/iframe-api/v1';script.async=true;script.onerror=()=>tell('error',{message:'Spotify API could not connect'});document.body.append(script);
setTimeout(()=>{if(!controller){document.getElementById('error').hidden=false;document.getElementById('official').href='https://open.spotify.com/track/'+(valid?id:'');tell('error',{message:'Spotify timeout'})}},18000);
</script></body></html>
